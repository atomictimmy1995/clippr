<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Clippr{% endblock %}</title>
  <script src="/static/htmx.min.js" defer></script>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e8eaf0; --muted: #9aa3b5;
      --accent: #ffd34d; --accent-text: #1b1600; --ok: #4ade80; --bad: #f87171;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.5; }
    a { color: var(--accent); }
    header { border-bottom: 1px solid var(--line); }
    header .wrap { display: flex; align-items: baseline; gap: 12px; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 18px 20px; }
    .logo { font-weight: 800; font-size: 22px; color: var(--text); text-decoration: none; letter-spacing: -0.02em; }
    .logo span { color: var(--accent); }
    .tag { color: var(--muted); font-size: 14px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin: 18px 0; }
    h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -0.01em; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 6px; }
    input[type=url], input[type=text], input[type=number] {
      width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line);
      background: #0c0e12; color: var(--text); font-size: 15px;
    }
    .row { display: grid; grid-template-columns: 140px 1fr; gap: 14px; }
    .check { display: flex; gap: 10px; align-items: flex-start; color: var(--text); font-size: 14px; margin-top: 14px; }
    .check input { margin-top: 4px; }
    button, .btn {
      display: inline-block; border: 0; border-radius: 8px; padding: 10px 16px; font-size: 15px; font-weight: 600;
      background: var(--accent); color: var(--accent-text); cursor: pointer; text-decoration: none;
    }
    .btn.secondary, button.secondary { background: #262b36; color: var(--text); }
    button.danger { background: transparent; color: var(--bad); border: 1px solid #4b2a2a; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
    .muted { color: var(--muted); font-size: 14px; }
    .error { background: #2a1416; border: 1px solid #5b2329; color: #fecaca; padding: 10px 12px; border-radius: 8px; margin-top: 12px; }
    .note { background: #262012; border: 1px solid #4a3d16; color: #fde68a; padding: 10px 12px; border-radius: 8px; margin-top: 12px; font-size: 14px; }
    .bar { height: 10px; background: #0c0e12; border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
    .bar > div { height: 100%; background: var(--accent); transition: width .6s ease; }
    .stages { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 0; padding: 0; list-style: none; font-size: 13px; }
    .stages li { padding: 3px 9px; border-radius: 99px; background: #0c0e12; color: var(--muted); border: 1px solid var(--line); }
    .stages li.done { color: var(--ok); border-color: #1f4d33; }
    .stages li.current { color: var(--accent-text); background: var(--accent); border-color: var(--accent); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    td, th { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    .pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #262b36; white-space: nowrap; }
    .pill.done { background: #12301f; color: var(--ok); }
    .pill.failed { background: #3a1518; color: var(--bad); }
    .pill.running, .pill.queued { background: #3a3110; color: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
    .clip { background: #0c0e12; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .clip video { width: 100%; aspect-ratio: 9 / 16; background: #000; display: block; }
    .clip .body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .clip h3 { font-size: 15px; margin: 0; }
    .clip .hook { font-size: 13px; color: var(--muted); }
    .clip .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
    .clip .score { color: var(--accent); font-weight: 700; }
    .clip .actions { margin-top: auto; padding-top: 8px; }
    .clip .actions .btn { padding: 7px 10px; font-size: 13px; }
    details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
    footer { color: var(--muted); font-size: 13px; padding: 30px 20px; text-align: center; }
  </style>
</head>
<body>
  <header><div class="wrap"><a class="logo" href="/">clip<span>pr</span></a><span class="tag">YouTube → captioned vertical clips</span></div></header>
  <main class="wrap">{% block content %}{% endblock %}</main>
  <footer>Only clip videos you own or have permission to use.</footer>
</body>
</html>
