[project]
name = "clippr"
version = "0.1.0"
description = "Turn a YouTube link into captioned, speaker-tracked 9:16 clips of its key moments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "fastapi>=0.115",
    "faster-whisper>=1.1",
    "httpx>=0.27",
    "jinja2>=3.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.10,<5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.30",
    "yt-dlp>=2025.1.1",
]

[project.scripts]
clippr = "clippr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clippr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: renders real video with ffmpeg (slower)",
]
